<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Fitness Trainer</title><base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness Trainer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>try{var t=localStorage.getItem('ft_theme');if(t){document.documentElement.dataset.theme=t;if(t==='light')document.querySelector('meta[name=theme-color]').setAttribute('content','#f8fafc')}}catch(e){}</script>
<style>
/* Hintergrund sofort, damit vor dem Laden der Styles nichts Weißes aufblitzt */
html{background:#0f172a}html[data-theme=light]{background:#f8fafc}
/* Splash Screen: erscheint sofort, wird nach dem Start der App ausgeblendet */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#f1f5f9;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;transition:opacity .45s ease}
#splash.hide{opacity:0;pointer-events:none}
html[data-theme=light] #splash{background:#f8fafc;color:#0f172a}
.sp-logo{width:min(46vw,200px);height:auto;overflow:visible}
.sp-logo circle{fill:none;stroke-width:8}
.sp-track{stroke:#334155}html[data-theme=light] .sp-track{stroke:#e2e8f0}
.sp-bell rect{fill:#f1f5f9}html[data-theme=light] .sp-bell rect{fill:#0f172a}
.sp-seg{animation:spseg .35s ease-out both;animation-delay:calc(var(--i)*.14s)}
.sp-prog{stroke:#ef4444;stroke-linecap:round;animation:spprog .8s ease-out .5s both}
html[data-theme=light] .sp-prog{stroke:#dc2626}
.sp-bell{transform-origin:70px 70px;animation:spbell .4s ease-out .9s both}
.sp-title{margin-top:1.6rem;font-size:1.25rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;animation:spfade .5s ease 1s both}
.sp-sub{margin-top:.3rem;font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:#ef4444;animation:spfade .5s ease 1.15s both}
html[data-theme=light] .sp-sub{color:#dc2626}
@keyframes spseg{from{stroke-dasharray:0 100}to{stroke-dasharray:17.8 82.2}}
@keyframes spprog{from{stroke-dasharray:0 100}to{stroke-dasharray:64 36}}
@keyframes spbell{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes spfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
</style></head>
<body>
<div id="splash" aria-hidden="true">
  <svg class="sp-logo" viewBox="0 0 140 140"><g transform="rotate(-90 70 70)"><circle class="sp-seg" style="--i:0" cx="70" cy="70" r="52" pathLength="100" stroke="#ef4444" stroke-dasharray="17.8 82.2" stroke-dashoffset="0"/><circle class="sp-seg" style="--i:1" cx="70" cy="70" r="52" pathLength="100" stroke="#f59e0b" stroke-dasharray="17.8 82.2" stroke-dashoffset="-20"/><circle class="sp-seg" style="--i:2" cx="70" cy="70" r="52" pathLength="100" stroke="#22c55e" stroke-dasharray="17.8 82.2" stroke-dashoffset="-40"/><circle class="sp-seg" style="--i:3" cx="70" cy="70" r="52" pathLength="100" stroke="#3b82f6" stroke-dasharray="17.8 82.2" stroke-dashoffset="-60"/><circle class="sp-seg" style="--i:4" cx="70" cy="70" r="52" pathLength="100" stroke="#a855f7" stroke-dasharray="17.8 82.2" stroke-dashoffset="-80"/><circle class="sp-track" cx="70" cy="70" r="39"/><circle class="sp-prog" cx="70" cy="70" r="39" pathLength="100" stroke-dasharray="64 36"/></g>
    <g class="sp-bell"><rect x="43" y="58" width="6" height="24" rx="2"/><rect x="50" y="62" width="5" height="16" rx="2"/><rect x="56" y="67" width="28" height="6"/><rect x="85" y="62" width="5" height="16" rx="2"/><rect x="91" y="58" width="6" height="24" rx="2"/></g></svg>
  <div class="sp-title">Fitness Trainer</div>
  <div class="sp-sub">Dein Training. Dein Workout.</div>
</div>
<app-root></app-root>
<script>setTimeout(function(){var s=document.getElementById('splash');if(s)s.remove()},10000)</script>
</body></html>
