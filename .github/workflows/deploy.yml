# Baut die Angular-App und veröffentlicht sie bei jedem Push auf "main" über GitHub Pages.
# Einmalig nötig: Repository → Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Bauen (Production, PWA mit Service Worker)
        # Projekt-Seiten liegen unter /<repo-name>/ – der Basis-Pfad wird automatisch gesetzt.
        # Bei einem Repo namens <user>.github.io stattdessen --base-href "/" verwenden.
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/fitness-trainer/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
